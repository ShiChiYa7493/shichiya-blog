# NapCat —— QQ 协议端，为 Koishi 提供 OneBot 11 接入。
#
# 启动：
#   cd packages/wf-bot/napcat
#   NAPCAT_UID=$(id -u) NAPCAT_GID=$(id -g) docker compose up -d
#
# 登录：浏览器打开 http://127.0.0.1:6099/webui ，用日志里的 token 进去后扫码。
#   token 获取：docker logs napcat 2>&1 | grep -i token
#
# 端口：
#   3011 → 容器内 3001   WebSocket，Koishi 的 adapter-onebot 连这里
#   6099                 WebUI，仅用于登录与配置
#
# 注意宿主机侧用 3011 而非 3001：服务器上 3001 已被博客后端 blog-api 占用。
#
# 两个不能省的点：
#   - ./ntqq 挂载的是登录态。不挂载的话容器一重建就要重新扫码。
#   - mac_address 固化设备指纹。每次重建都换 MAC 会被腾讯当成异地登录，
#     显著提高风控命中率。
#   - .env 存放 ACCOUNT 与 NAPCAT_QUICK_PASSWORD，权限 600，已在 .gitignore 中。
#     webui.json 的 autoLoginAccount 只能在凭据仍有效时快速登录；
#     腾讯判定会话失效后必须有密码才能自动恢复，否则只能人工扫码。
services:
  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: napcat
    restart: always
    network_mode: bridge
    mac_address: 02:42:ac:11:00:02

    # 凭据从同目录 .env 读取，不写进本文件（本文件在仓库里）。
    # ACCOUNT + NAPCAT_QUICK_PASSWORD 是掉线兜底：
    # 登录态被腾讯判失效时，仅靠 ntqq 里的凭据无法自动恢复，必须重新扫码；
    # 配上密码后 NapCat 能自己登回来。二维码登录始终作为最后兜底。
    env_file:
      - .env
    environment:
      - NAPCAT_UID=${NAPCAT_UID}
      - NAPCAT_GID=${NAPCAT_GID}

    ports:
      # 只绑回环：这两个端口暴露到公网等于把 QQ 号和一个可执行任意命令的
      # 后台交出去。远程访问请走 SSH 隧道。
      - 127.0.0.1:3011:3001
      - 127.0.0.1:6099:6099

    volumes:
      - ./config:/app/napcat/config
      - ./ntqq:/app/.config/QQ
